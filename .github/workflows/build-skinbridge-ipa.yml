name: Build SkinBridge IPA
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "SkinBridge-iOS/**"
      - ".github/workflows/build-skinbridge-ipa.yml"
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build unsigned IPA
        run: |
          xcodebuild -version
          chmod +x SkinBridge-iOS/build-ipa.sh SkinBridge-iOS/build-airlift.sh
          SkinBridge-iOS/build-ipa.sh
          cp SkinBridge-iOS/build/SkinBridge.ipa SkinBridge-iOS/build/SkinBridge-unsigned.ipa
      - name: Sign IPA when distribution credentials are configured
        id: signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          if [ -z "$IOS_CERTIFICATE_P12_BASE64" ] || [ -z "$IOS_MOBILEPROVISION_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Signing credentials are not configured; keeping the SideStore test build."
            exit 0
          fi

          SIGNING_DIRECTORY="$RUNNER_TEMP/skinbridge-signing"
          SIGNING_KEYCHAIN="$RUNNER_TEMP/skinbridge-signing.keychain-db"
          SIGNING_KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          mkdir -p "$SIGNING_DIRECTORY"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$SIGNING_DIRECTORY/distribution.p12"
          printf '%s' "$IOS_MOBILEPROVISION_BASE64" | base64 -D > "$SIGNING_DIRECTORY/SkinBridge.mobileprovision"

          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$SIGNING_DIRECTORY/distribution.p12" -k "$SIGNING_KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"

          chmod +x SkinBridge-iOS/sign-ipa.sh
          SkinBridge-iOS/sign-ipa.sh \
            SkinBridge-iOS/build/SkinBridge-unsigned.ipa \
            "$SIGNING_DIRECTORY/distribution.p12" \
            "$SIGNING_DIRECTORY/SkinBridge.mobileprovision" \
            "$SIGNING_KEYCHAIN" \
            SkinBridge-iOS/build/SkinBridge-signed.ipa

          security delete-keychain "$SIGNING_KEYCHAIN"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: SkinBridge-unsigned-ipa
          path: SkinBridge-iOS/build/SkinBridge-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'true'
        with:
          name: SkinBridge-signed-ipa
          path: SkinBridge-iOS/build/SkinBridge-signed.ipa
          if-no-files-found: error
      - name: Publish stable IPA files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view skinbridge-latest >/dev/null 2>&1 || gh release create skinbridge-latest --title "SkinBridge latest" --notes "SkinBridge installation builds."
          gh release upload skinbridge-latest SkinBridge-iOS/build/SkinBridge-unsigned.ipa --clobber
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            gh release upload skinbridge-latest SkinBridge-iOS/build/SkinBridge-signed.ipa --clobber
          fi
