name: Build AirLift Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "SkinBridge-iOS/rust-core/**"
      - ".github/workflows/build-airlift-gateway.yml"

permissions:
  contents: read

jobs:
  linux-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test endpoint selection
        run: cargo test --manifest-path SkinBridge-iOS/rust-core/Cargo.toml --lib endpoint_tests
      - name: Build server gateway
        run: cargo build --release --manifest-path SkinBridge-iOS/rust-core/Cargo.toml --bin airlift-gateway
      - name: Smoke test CLI
        run: |
          set +e
          SkinBridge-iOS/rust-core/target/release/airlift-gateway
          code=$?
          set -e
          test "$code" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: airlift-gateway-linux-x86_64
          path: SkinBridge-iOS/rust-core/target/release/airlift-gateway
          if-no-files-found: error
