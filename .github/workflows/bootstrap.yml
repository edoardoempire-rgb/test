name: Bootstrap Wallet Skins
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat .github/bootstrap/source.part01 .github/bootstrap/source.part02 | base64 -d > /tmp/wallet-skins-source.tar.xz
          tar -xJf /tmp/wallet-skins-source.tar.xz -C .
          rm -rf .github/bootstrap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Initial Wallet Skins POC"
          git push origin HEAD:main
          for attempt in 1 2 3 4 5 6; do
            gh workflow run build-skinbridge-ipa.yml --ref main && break
            sleep 5
          done
