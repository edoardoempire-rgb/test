name: Deploy Wallet Skins VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build SkinBridge IPA"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download latest tested AirLift gateway
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GATEWAY_RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-airlift-gateway.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$GATEWAY_RUN_ID"
          mkdir -p bin
          gh run download "$GATEWAY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name airlift-gateway-linux-x86_64 --dir bin
          chmod 0755 bin/airlift-gateway
          echo "Gateway from successful run $GATEWAY_RUN_ID"

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Upload and start Wallet Skins
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$SSHPASS"
          test -n "$VPS_HOST"
          test -n "$VPS_USER"

          SIGNED_IPA_URL="https://github.com/edoardoempire-rgb/test/releases/download/skinbridge-latest/SkinBridge-signed.ipa"
          UNSIGNED_IPA_URL="https://github.com/edoardoempire-rgb/test/releases/download/skinbridge-latest/SkinBridge-unsigned.ipa"
          if curl --fail --location --silent --head "$SIGNED_IPA_URL" >/dev/null; then
            SKINBRIDGE_IPA_URL="$SIGNED_IPA_URL"
            SKINBRIDGE_SIDELOAD_IPA_URL=""
          else
            SKINBRIDGE_IPA_URL=""
            SKINBRIDGE_SIDELOAD_IPA_URL="$UNSIGNED_IPA_URL"
          fi

          SSH_OPTIONS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15"
          sshpass -e ssh $SSH_OPTIONS "$VPS_USER@$VPS_HOST" \
            'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y rsync && install -d -m 0755 /opt/wallet-skins'

          sshpass -e rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'outputs/' \
            --exclude 'work/' \
            -e "ssh $SSH_OPTIONS" \
            ./ "$VPS_USER@$VPS_HOST:/opt/wallet-skins/"

          sshpass -e ssh $SSH_OPTIONS "$VPS_USER@$VPS_HOST" \
            'chmod +x /opt/wallet-skins/scripts/setup-server-bridge.sh && /opt/wallet-skins/scripts/setup-server-bridge.sh wallet.82-165-176-79.sslip.io'

          sshpass -e ssh $SSH_OPTIONS "$VPS_USER@$VPS_HOST" "cat > /opt/wallet-skins/.env" <<ENV_FILE
          PORT=8787
          DOMAIN=wallet.82-165-176-79.sslip.io
          PUBLIC_BASE_URL=https://wallet.82-165-176-79.sslip.io
          WEB_CALLBACK_URL=https://wallet.82-165-176-79.sslip.io/callback.html
          JOB_TTL_SECONDS=120
          ALLOW_WEB_DEMO=true
          EXECUTOR_MODE=airlift
          HELPER_INSTALL_URL=
          SKINBRIDGE_IPA_URL=$SKINBRIDGE_IPA_URL
          SKINBRIDGE_SIDELOAD_IPA_URL=$SKINBRIDGE_SIDELOAD_IPA_URL
          SIDESTORE_SETUP_URL=https://sideinstaller.net/
          SKINBRIDGE_BUNDLE_ID=com.walletskins.skinbridge
          SKINBRIDGE_VERSION=0.1.0
          SKINBRIDGE_TITLE=SkinBridge
          SUPPORT_URL=
          ENV_FILE

          sshpass -e ssh $SSH_OPTIONS "$VPS_USER@$VPS_HOST" \
            'printf "\nSERVER_BRIDGE_ENABLED=true\nSERVER_BRIDGE_BINARY=/app/bin/airlift-gateway\nSERVER_BRIDGE_STATE_DIR=/var/lib/wallet-skins-bridge\nSERVER_BRIDGE_BIND=0.0.0.0\nSERVER_BRIDGE_PAIR_PORT=49153\nSERVER_BRIDGE_DOMAIN=wallet.internal\nSERVER_BRIDGE_ADDRESS=10.66.0.1\nSERVER_BRIDGE_DNS_BIND=10.66.0.1\nSERVER_BRIDGE_DNS_PORT=53\nSERVER_BRIDGE_DNS_UPSTREAM=1.1.1.1\nSERVER_BRIDGE_DEVICE_ENDPOINT=10.66.0.2:49152\n" >> /opt/wallet-skins/.env && cat /etc/wallet-skins/bridge.env >> /opt/wallet-skins/.env && chmod 0600 /opt/wallet-skins/.env'

          sshpass -e ssh $SSH_OPTIONS "$VPS_USER@$VPS_HOST" \
            'chmod +x /opt/wallet-skins/scripts/deploy-vps.sh && cd /opt/wallet-skins && ./scripts/deploy-vps.sh'

      - name: Verify public health endpoint
        run: |
          curl --fail --show-error --silent --retry 10 --retry-delay 6 https://wallet.82-165-176-79.sslip.io/health >/dev/null
          export SESSION_JSON="$(curl --show-error --silent --request POST https://wallet.82-165-176-79.sslip.io/v1/server-bridge/sessions)"
          SESSION_ID="$(node -e 'const v=JSON.parse(process.env.SESSION_JSON); if(v.state!=="profile_ready"){ console.error(v.error || "pairing session did not start"); process.exit(2); } process.stdout.write(v.id)' )"
          SESSION_TOKEN="$(node -e 'const v=JSON.parse(process.env.SESSION_JSON); process.stdout.write(v.token)' )"
          PROFILE_URL="$(node -e 'const v=JSON.parse(process.env.SESSION_JSON); process.stdout.write(v.profileUrl)' )"
          curl --fail --show-error --silent "$PROFILE_URL" | grep -q '<string>IKEv2</string>'
          curl --fail --show-error --silent --request DELETE "https://wallet.82-165-176-79.sslip.io/v1/server-bridge/sessions/$SESSION_ID?token=$SESSION_TOKEN" >/dev/null
