name: SkinBridge
options:
  bundleIdPrefix: com.walletskins
  deploymentTarget: { iOS: "18.0" }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    OTHER_SWIFT_FLAGS: "$(inherited) -DSKINBRIDGE_REAL"
    OTHER_LDFLAGS: "-lc++"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: "x86_64"
targets:
  SkinBridge:
    type: application
    platform: iOS
    sources:
      - path: SkinBridge
      - path: Upstream
    dependencies:
      - framework: Vendor/AirliftFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walletskins.skinbridge
        INFOPLIST_FILE: SkinBridge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
