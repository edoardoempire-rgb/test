name: SkinBridge
options:
  bundleIdPrefix: com.walletskins
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SkinBridge:
    type: application
    platform: iOS
    sources:
      - path: SkinBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walletskins.skinbridge
        INFOPLIST_FILE: SkinBridge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
