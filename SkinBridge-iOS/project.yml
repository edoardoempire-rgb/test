name: SkinBridge
options:
  bundleIdPrefix: com.walletskins
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SkinBridgeTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: TunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walletskins.skinbridge.tunnel
        PRODUCT_NAME: SkinBridgeTunnel
        INFOPLIST_FILE: TunnelProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: TunnelProvider/TunnelProvider.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  SkinBridge:
    type: application
    platform: iOS
    sources:
      - path: SkinBridge
    dependencies:
      - target: SkinBridgeTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walletskins.skinbridge
        INFOPLIST_FILE: SkinBridge/Info.plist
        CODE_SIGN_ENTITLEMENTS: SkinBridge/SkinBridge.entitlements
        GENERATE_INFOPLIST_FILE: NO
